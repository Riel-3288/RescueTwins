  namespace: rescuetwin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bridge
  template:
    metadata:
      labels:
        app: bridge
    spec:
      containers:
      - name: bridge
        image: registry.example.invalid/rescuetwin:2026-11-08
        env:
        - name: CSE_A_TOKEN
          valueFrom:
            secretKeyRef:
              name: cse-tokens
              key: a
        - name: CSE_B_TOKEN
          valueFrom:
            secretKeyRef:
              name: cse-tokens
              key: b
        - name: CSE_IN_TOKEN
          valueFrom:
            secretKeyRef:
              name: cse-tokens
              key: in
