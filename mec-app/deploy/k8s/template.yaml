apiVersion: v1
kind: Namespace
metadata:
  name: rescuetwin
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: integration-config
  namespace: rescuetwin
data:
  config.json: "{\n  \"require_tls\": true,\n  \"state_file\": \"/data/bridge.sqlite\"\
    ,\n  \"ipe_state_file\": \"/data/ipe.sqlite\",\n  \"ipe_zone\": \"A\",\n  \"mqtt\"\
    : {\"host\": \"mqtt\", \"port\": 8883, \"client_id\": \"rescuetwin-bridge\", \"\
    ca_file\": \"/certs/ca.crt\", \"cert_file\": \"/certs/bridge.crt\", \"key_file\"\
    : \"/certs/bridge.key\"},\n  \"cse\": {\n    \"A\": {\"base_url\": \"https://cse-a:18001/~/id-mn-a/cse-mn-a\"\
    , \"ca_file\": \"/certs/ca.crt\", \"token_env\": \"CSE_A_TOKEN\"},\n    \"B\"\
    : {\"base_url\": \"https://cse-b:18002/~/id-mn-b/cse-mn-b\", \"ca_file\": \"/certs/ca.crt\"\
    , \"token_env\": \"CSE_B_TOKEN\"},\n    \"IN\": {\"base_url\": \"https://cse-in:18000/~/id-in/cse-in\"\
    , \"ca_file\": \"/certs/ca.crt\", \"token_env\": \"CSE_IN_TOKEN\"}\n  },\n  \"\
    devices\": {\n    \"node-01\": {\"originator\": \"CNode01\", \"zones\": [\"A\"\
    ]},\n    \"node-02\": {\"originator\": \"CNode02\", \"zones\": [\"A\"]},\n   \
    \ \"node-03\": {\"originator\": \"CNode03\", \"zones\": [\"B\"]}\n  },\n  \"agents\"\
    : {\n    \"agent-01\": {\"originator\": \"CAgent01\", \"address\": \"10.10.0.1\"\
    },\n    \"agent-02\": {\"originator\": \"CAgent02\", \"address\": \"10.10.0.2\"\
    }\n  },\n  \"factory\": {\"width_m\": 100, \"height_m\": 60, \"boundary_x_m\"\
    : 50, \"hysteresis_m\": 2, \"confirm_samples\": 2, \"origin_lat\": 2.831, \"origin_lon\"\
    : 101.706},\n  \"mec\": {\"location_url\": \"\", \"rnis_url\": \"\", \"app_support_url\"\
    : \"\", \"token_env\": \"MEC_TOKEN\", \"max_location_age_s\": 30}\n}\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mqtt-config
  namespace: rescuetwin
data:
  mosquitto.conf: 'listener 8883

    cafile /mosquitto/certs/ca.crt

    certfile /mosquitto/certs/broker.crt

    keyfile /mosquitto/certs/broker.key

    require_certificate true

    use_identity_as_username true

    allow_anonymous false

    acl_file /mosquitto/config/acl

    tls_version tlsv1.2

    persistence true

    persistence_location /mosquitto/data/

    '
  acl: 'user bridge

    topic read rescuetwin/+/+/+

    topic write rescuetwin-ack/+/+


    user node-01

    topic write rescuetwin/A/node-01/+

    topic read rescuetwin-ack/A/node-01


    user node-02

    topic write rescuetwin/A/node-02/+

    topic read rescuetwin-ack/A/node-02


    user node-03

    topic write rescuetwin/B/node-03/+

    topic read rescuetwin-ack/B/node-03

    '
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cse-a-data
  namespace: rescuetwin
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: cse-a
  namespace: rescuetwin
spec:
  selector:
    app: cse-a
  ports:
  - port: 18001
    targetPort: 18001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cse-a
  namespace: rescuetwin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cse-a
  template:
    metadata:
      labels:
        app: cse-a
    spec:
      containers:
      - name: cse-a
        image: registry.example.invalid/rescuetwin:2026-11-08
        env:
        - name: CSE_TYPE
          value: MN
        - name: CSE_ID
          value: id-mn-a
        - name: CSE_NAME
          value: cse-mn-a
        - name: CSE_PORT
          value: '18001'
        - name: CSE_HOST
          value: cse-a
        - name: CSE_TLS
          value: 'true'
        - name: CSE_SERVER_TOKEN
          valueFrom:
            secretKeyRef:
              name: cse-tokens
              key: a
        volumeMounts:
        - name: data
          mountPath: /data
        - name: certs
          mountPath: /certs
          readOnly: true
        command:
        - python
        - tools/acme_config.py
        ports:
        - containerPort: 18001
        readinessProbe:
          tcpSocket:
            port: 18001
          initialDelaySeconds: 5
          periodSeconds: 5
      securityContext:
        fsGroup: 1883
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: cse-a-data
      - name: certs
        secret:
          secretName: cse-a-certs
          defaultMode: 288
      nodeSelector:
        rescuetwin-mec-zone: A
---
