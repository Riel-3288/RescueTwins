name: rescuetwin-zone-a-mqtt

services:
  broker:
    image: eclipse-mosquitto:2
    restart: unless-stopped

    ports:
      - "0.0.0.0:1883:1883"

    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ../../.mqtt-local/passwords:/mosquitto/config/passwords:ro

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
